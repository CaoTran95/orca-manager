# Danh mục repository trung tâm cho Orca Manager.
# Không lưu path máy: resolve bằng `orca repo show --repo <selector> --json`.
# Worktree đang chạy: `orca worktree list --json` (nguồn sự thật, không copy vào đây).
# baseRef: ref DUY NHẤT được phép dùng làm gốc khi tạo worktree mới cho repo đó.
#   Không suy đoán/mặc định origin/develop hay origin/main; đọc đúng entry của repo.
# status: verified = baseRef đã kiểm tra (`git branch -r` + `orca repo list`), được tạo worktree.
#         needs-confirmation = phải được người dùng xác nhận baseRef trước khi tạo worktree.
#         Thiếu baseRef hoặc status khác verified => dừng và hỏi người dùng.
# Chỉ sửa file này tại Orca Manager/main (xem AGENTS.md, mục Harness ownership).
version: 1
verified_on: 2026-10-21
repositories:
  - id: android-app
    name: bithumb-fashion-android-app
    selector: name:bithumb-fashion-android-app
    remote: git@gitlab.com:bithumb.vn/bidu-android-app.git
    kind: android
    baseRef: origin/develop
    status: verified
  - id: ecommerce-backend
    name: bidu-ecommerce-backend
    selector: name:bidu-ecommerce-backend
    remote: git@gitlab.com:bithumb.vn/bidu-ecommerce-backend.git
    kind: backend
    baseRef: origin/develop
    status: verified
    notes: origin/HEAD là master; worktree hiện có tạo từ develop.
  - id: marketing-backend
    name: bidu-marketing-backend
    selector: name:bidu-marketing-backend
    remote: git@gitlab.com:bithumb.vn/bidu-marketing-backend.git
    kind: backend
    baseRef: origin/develop
    status: verified
  - id: community-backend
    name: bithumb-fashion-backend
    selector: name:bithumb-fashion-backend
    remote: git@gitlab.com:bithumb.vn/bidu-community-backend.git
    kind: backend
    baseRef: origin/develop
    status: verified
  - id: commerce-cronjob-backend
    name: bidu-commerce-cronjob-backend
    selector: name:bidu-commerce-cronjob-backend
    remote: git@gitlab.com:bithumb.vn/bidu-commerce-cronjob-backend.git
    kind: backend
    baseRef: origin/staging
    status: needs-confirmation
    notes: Không có origin/develop; worktree hiện có dùng origin/staging, origin/HEAD là master. Hỏi người dùng trước khi tạo worktree mới.
  - id: ai-backend
    name: bidu-ai-backend
    selector: name:bidu-ai-backend
    remote: git@gitlab.com:bithumb.vn/bidu-ai-backend.git
    kind: ai-backend
    baseRef: origin/develop
    status: verified
    notes: origin/HEAD là main; worktree hiện có tạo từ develop.
  - id: mcp
    name: bidu-mcp
    selector: name:bidu-mcp
    remote: git@gitlab.com:bithumb.vn/bidu-mcp.git
    kind: backend
    baseRef: origin/develop
    status: verified
  - id: admin
    name: bidu-admin
    selector: name:bidu-admin
    remote: git@gitlab.com:bithumb.vn/bidu-admin.git
    kind: frontend
    baseRef: origin/develop
    status: verified
  - id: webapp
    name: bidu-ecommerce-webapp
    selector: name:bidu-ecommerce-webapp
    remote: git@gitlab.com:bithumb.vn/bidu-webapp.git
    kind: frontend
    baseRef: origin/develop
    status: verified
  - id: hermes-agent
    name: bidu-hermes-agent
    selector: name:bidu-hermes-agent
    remote: git@github.com:dungbeotl/bidu-hermes-agent.git
    kind: ai-agent
    baseRef: origin/main
    status: verified
  - id: android-hardware-profile
    name: Android-Hardware-Profile
    selector: name:Android-Hardware-Profile
    remote: https://github.com/Wildanafian/Android-Hardware-Profile.git
    kind: android
    baseRef: origin/main
    status: verified
  - id: hermes-agentic
    name: Hermes Agentic
    selector: name:Hermes Agentic
    remote: null
    kind: workspace
    baseRef: main
    status: verified
    notes: Không có remote; dùng local main.
  - id: hermes-profile-config
    name: profile-config
    selector: name:profile-config
    remote: git@github.com:CaoTran95/hermes-agent-profiles.git
    kind: ai-agent-profiles
    baseRef: origin/develop
    status: verified
    notes: Profile bot Hermes (profiles/qa-support, skills). Nằm ở Desktop/android/hermes/profile-config. Checkout chính đang ở nhánh feat/qa-support-seed-refund có thay đổi local; worktree mới tạo từ origin/develop không chứa chúng.
  - id: hermes-admin-mcp
    name: bidu-admin-mcp
    selector: name:bidu-admin-mcp
    remote: null
    kind: mcp
    baseRef: main
    status: verified
    notes: MCP tool gọi API admin (TypeScript). Không có remote; dùng main cục bộ. bidu-admin-mcp-seed là worktree có sẵn của repo này (feat/seed-refund-tool); checkout chính có thay đổi local.
  - id: hermes-qa-web
    name: qa-support-web
    selector: name:qa-support-web
    remote: git@github.com:CaoTran95/qa-support-chatbot.git
    kind: frontend
    baseRef: origin/main
    status: verified
    notes: Web chatbot qa-support (Desktop/android/hermes/qa-support-web); origin/HEAD là origin/main.
  - id: rea
    name: REA
    selector: name:REA
    remote: null
    kind: reverse-engineering
    baseRef: main
    status: verified
    notes: Project phân tích ứng dụng bằng MCP rea-agents (Desktop/android/REA), repo git riêng. Không có remote; dùng main cục bộ. app/ và source/* bị ignore.
  - id: orca-manager
    name: Orca Manager
    selector: name:Orca Manager
    remote: null
    kind: manager
    baseRef: main
    status: verified
    notes: Repo điều phối này. Không có remote; không giao worker sửa trực tiếp checkout main.
