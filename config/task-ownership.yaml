# Quyền ghi task record (docs/tasks/) của feature worktree ngoài quy ước tên
# docs/tasks/YYYY-MM-DD-<key>[-suffix].md. Do main duyệt; feature worktree không tự sửa được.
# Mỗi task có MỘT owner chính (key = tên branch feat/<key>, "/" -> "-").
#   owner_status: proposed  = đề xuất, chờ user xác nhận (quyền thực tế KHÔNG đổi so với trước).
#                 confirmed = user đã xác nhận.
#   grandfathered: feature khác đã commit file này trước khi có guard; vẫn được tiếp tục ghi để
#                  không làm hỏng commit hiện có. Gỡ khỏi danh sách chỉ khi user duyệt.
# File MỚI của feature lớn: khai báo `owns:` trong front matter file chính (guard từ chối nếu
# trùng owner/claim khác; xem scripts/ownership.rb conflicts). Chỉ liệt kê file không glob.
version: 2
tasks:
  docs/tasks/2026-10-21-case9-expanded.md:
    owner: orca-manager-task-workflow
    owner_status: proposed
    grandfathered: [content-translation-ai]
  docs/tasks/2026-10-21-case9b-input-change.md:
    owner: orca-manager-task-workflow
    owner_status: proposed
  docs/tasks/2026-10-21-case9b-marketing-processing.md:
    owner: orca-manager-task-workflow
    owner_status: proposed
  docs/tasks/2026-10-21-orca-manager-task-workflow.md:
    owner: orca-manager-task-workflow
    owner_status: proposed
    grandfathered: [content-translation-ai]
